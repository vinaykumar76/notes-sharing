{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <div class="auth-header text-center">
            <h2>Welcome Back</h2>
            <p>Login to access your dashboard and download notes.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="ph ph-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" required placeholder="student@college.edu">
            </div>

            <div class="form-group">
                <label for="password"><i class="ph ph-lock"></i> Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary w-100">Login to Dashboard</button>
        </form>

        <div class="auth-footer text-center">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-link">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
