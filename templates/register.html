{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <div class="auth-header text-center">
            <h2>Create an Account</h2>
            <p>Join the community and start sharing knowledge.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="name"><i class="ph ph-user"></i> Full Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. John Doe">
            </div>

            <div class="form-group">
                <label for="email"><i class="ph ph-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" required placeholder="student@college.edu">
            </div>

            <div class="form-group">
                <label for="password"><i class="ph ph-lock"></i> Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="branch"><i class="ph ph-buildings"></i> Branch/Dept</label>
                    <select id="branch" name="branch" required>
                        <option value="" disabled selected>Select Branch</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group half">
                    <label for="year"><i class="ph ph-calendar"></i> Current Year</label>
                    <select id="year" name="year" required>
                        <option value="" disabled selected>Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary w-100">Register</button>
        </form>

        <div class="auth-footer text-center">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="text-link">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
